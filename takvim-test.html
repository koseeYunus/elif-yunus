<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Takvim testi</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 24px 16px 48px; background: #FBF7F0; color: #1C2A23; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 520px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 0 0 14px; color: #3E4B43; }
  .sonuc { padding: 12px 14px; border-radius: 12px; background: #FBE9E5; color: #8E3A2A; font-weight: 600; }
  .sonuc[hidden] { display: none; }
  ol { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  a.btn { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: #fff; border: 1px solid #E2D6C1; color: inherit; text-decoration: none; }
  a.btn b { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #1C2A23; color: #F2DDA9; }
  a.btn small { display: block; color: #6B756F; font-size: 13px; }
  .ua { margin-top: 22px; font-size: 12px; color: #7C877F; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Takvim testi</h1>
  <p>Her düğmeye sırayla dokunun. <b>Takvim uygulaması doğrudan açılırsa</b> o harfi not edin ve geri dönün. Açılmazsa bu sayfa “çalışmadı” diyerek geri gelir; hiçbir şey indirilmez.</p>
  <p class="sonuc" id="sonuc" hidden></p>
  <ol id="liste"></ol>
  <p class="ua" id="ua"></p>
</main>
<script>
  // Düğün etkinliği (ana sayfadaki takvim bilgileriyle aynı)
  const T = 'Elif & Yunus’un Düğünü';
  const LOC = 'Nazar Düğün Salonu, Sarıcalı, Güven Sk. No:1, 55500 Çarşamba/Samsun';
  const DESC = 'Gelin alma: 18.00 — Kirazlıkçay Mh. Zülal Işıl Çörtük Sk. Apt: 4\nDüğün: 19.00 — Nazar Düğün Salonu\n\nhttps://koseeyunus.github.io/elif-yunus/';
  const START = Date.parse('2026-11-15T19:00:00+03:00'), END = START + 4 * 3600e3;
  const e = encodeURIComponent, here = location.origin + location.pathname;
  const back = k => `S.browser_fallback_url=${e(here + '?sonuc=' + k)};`;   // açılamazsa bu sayfaya döner
  const extras = `S.title=${e(T)};S.eventLocation=${e(LOC)};S.description=${e(DESC)};l.beginTime=${START};l.endTime=${END};`;
  const stamp = t => new Date(t).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const gq = new URLSearchParams({ action: 'TEMPLATE', text: T, dates: stamp(START) + '/' + stamp(END), location: LOC, details: DESC }).toString();
  const yollar = [
    ['A', 'Takvime ekle komutu (etkinlik türüyle)', `intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.item/event;${extras}${back('A')}end`],
    ['B', 'Takvime ekle komutu (etkinlik listesi türüyle)', `intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/event;${extras}${back('B')}end`],
    ['C', 'Takvime ekle komutu (sistem takvim adresiyle)', `intent://com.android.calendar/events#Intent;scheme=content;action=android.intent.action.INSERT;${extras}${back('C')}end`],
    ['D', 'Doğrudan Google Takvim uygulaması', `intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.item/event;package=com.google.android.calendar;${extras}${back('D')}end`],
    ['E', 'Doğrudan Samsung Takvim uygulaması', `intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.item/event;package=com.samsung.android.calendar;${extras}${back('E')}end`],
    ['F', 'Takvim dosyasını uygulamaya ver (indirmeden)', `intent://koseeyunus.github.io/elif-yunus/dugun.ics#Intent;scheme=https;action=android.intent.action.VIEW;type=text/calendar;${back('F')}end`],
    ['G', 'Google Takvim bağlantısını uygulamada aç', `intent://calendar.google.com/calendar/render?${gq}#Intent;scheme=https;package=com.google.android.calendar;${back('G')}end`],
  ];
  const liste = document.getElementById('liste');
  for (const [k, ad, url] of yollar) {
    const li = document.createElement('li'), a = document.createElement('a');
    a.className = 'btn'; a.href = url;
    a.innerHTML = `<b>${k}</b><span>${ad}<small>Dokunun → takvim uygulaması açılırsa ${k} çalışıyor</small></span>`;
    li.append(a); liste.append(li);
  }
  const k = new URLSearchParams(location.search).get('sonuc');
  if (k) { const s = document.getElementById('sonuc'); s.textContent = `${k} çalışmadı (uygulama açılamadı, sayfaya geri dönüldü).`; s.hidden = false; }
  document.getElementById('ua').textContent = 'Cihaz: ' + navigator.userAgent;
</script>
</body>
</html>
