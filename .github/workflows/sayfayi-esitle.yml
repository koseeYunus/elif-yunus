# Yönetim ekranında değiştirilen isimleri, tarihi, salonu ve görünümü sayfanın durağan dosyalarına işler:
# WhatsApp/sosyal medya önizlemesi (index.html etiketleri ve paylaşım görseli), takvim dosyası (dugun.ics) ve
# sayfayı ilk kez açanlar için gömülü ilk veri. Bu uygulamalar sayfanın betiğini çalıştırmadığı için gerekli.
# Yarım saatte bir son kaydı okur; yalnızca bir şey değiştiyse commit atar ve sayfayı yeniden yayınlatır.
# Elle çalıştırmak için: GitHub › Actions › "Sayfayı eşitle" › Run workflow
name: Sayfayı eşitle

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write   # değişen dosyaları commit'lemek için
  pages: write      # bu görevin commit'leri GitHub Pages'i kendiliğinden yayınlatmadığı için yayını ayrıca istemek

concurrency:
  group: sayfayi-esitle
  cancel-in-progress: false

jobs:
  esitle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Son kaydı oku ve dosyaları güncelle
        run: node .github/esitle.mjs

      - name: Değişiklik varsa kaydet ve sayfayı yeniden yayınlat
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Değişiklik yok."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sayfa eşitlendi: yönetimdeki son değişiklikler"
          git push
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages/builds"
          echo
          echo "Yayın istendi; birkaç dakika içinde sayfada görünür."
